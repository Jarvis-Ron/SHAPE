[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-code"
version = "1.0.0"
description = "SHAPE: source-behavior transfer with opportunity-weighted rank and distance cost"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "torch>=2.2", "pandas>=2.0", "scipy>=1.10",
  "scikit-learn>=1.3", "tqdm>=4.65", "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shape = "SHAPE.__main__:main"

[tool.setuptools.packages.find]
include = ["SHAPE*"]

[tool.setuptools.package-data]
SHAPE = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
